[pytest]

pythonpath = .

;启用实显示日志输出在终端窗口
log_cli = false
; log_cli_level = INFO
; log_cli_format = %(asctime)s [%(levelname)-8s] %(funcName)s:%(lineno)d - %(message)s
; log_cli_date_format = %H:%M:%S

; 控制台输出的格式化设置
; log_print = true

# 设置默认的日志级别过滤器
filterwarnings =
    ignore::DeprecationWarning

# --- 文件日志 ---
# 所有测试过程的日志汇总文件
log_file = pytest_execution.log 
# 文件中的最低日志级别            
log_file_level = DEBUG                      
log_file_format = %(asctime)s [%(levelname)-8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
